<style>
:root{
  --bg:#F5F3EF; --paper:#FFFcf7; --ink:#1C1915; --navy:#24304D;
  --muted:#7A7468; --line:#E3DCD0; --rec:#8B3A32;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overscroll-behavior:none}
body{display:flex;flex-direction:column;min-height:100dvh;height:100dvh;padding:calc(var(--sat) + 8px) 0 calc(var(--sab) + 10px);overflow:hidden}
header{display:flex;align-items:center;gap:12px;padding:4px 16px 6px}
.brand{font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:.01em;text-wrap:balance;flex:1}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.06em}
.tally{padding:0 16px 8px;font-size:11px;line-height:1.45;color:var(--muted);text-wrap:pretty}
.tally p{margin:0 0 2px}
.tally b{color:var(--ink);font-weight:600}
.item-meta{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;padding:8px 16px 0;min-height:24px}
.item-brand{font:600 14px/1.2 var(--sans);color:var(--ink)}
.item-niche{font-size:12px;color:var(--muted)}
.badge-falta{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;background:#EFE6DC;color:var(--rec);font:600 11px/1 var(--sans);letter-spacing:.04em}
.badge-falta[hidden],.item-brand[hidden],.item-niche[hidden],.mic[hidden],.zoom-close[hidden]{display:none !important}
.export{height:44px;padding:0 14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;font:600 14px var(--sans);cursor:pointer}
.export:hover,.export:focus-visible{border-color:var(--navy);outline:2px solid var(--navy);outline-offset:2px}
.export:active{transform:scale(.97)}
.stage{flex:1;min-height:0;position:relative;margin:0 12px;border-radius:18px;background:var(--bg);overflow:hidden;border:1px solid var(--line);cursor:zoom-in;touch-action:pan-y}
.stage.zoomed{cursor:grab;touch-action:none}
.stage.zoomed.panning{cursor:grabbing}
.photo-wrap{position:absolute;inset:0;overflow:hidden;touch-action:inherit}
.photo-wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;background:var(--bg);transform-origin:center center;will-change:transform;-webkit-user-drag:none;user-select:none;pointer-events:auto}
.photo-wrap img.z-anim{transition:transform .2s ease}
.zoom-close{position:absolute;top:8px;right:8px;z-index:2;width:44px;height:44px;border:0;border-radius:50%;background:var(--paper);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 1px 0 rgba(28,25,21,.06),0 8px 20px -8px rgba(28,25,21,.45)}
.zoom-close:hover,.zoom-close:focus-visible{color:var(--navy);outline:2px solid var(--navy);outline-offset:2px}
.zoom-close:active{transform:scale(.92)}
.zoom-close svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav{display:flex;align-items:center;justify-content:center;gap:16px;padding:12px 16px 4px}
.nav button{width:52px;height:52px;border:0;border-radius:50%;background:var(--paper);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 1px 0 rgba(28,25,21,.06),0 6px 16px -8px rgba(28,25,21,.3);transition:transform .15s ease}
.nav button:hover{color:var(--navy)}
.nav button:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.nav button:active{transform:scale(.92)}
.nav button:disabled{opacity:.28;cursor:default;box-shadow:none}
.nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.notes{padding:8px 16px 0;display:flex;flex-direction:column;gap:8px}
.notes-top{display:flex;align-items:center;gap:8px}
.notes-top label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;flex:1}
.mic{width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex-shrink:0}
.mic:hover,.mic:focus-visible{border-color:var(--navy);outline:2px solid var(--navy);outline-offset:2px}
.mic:active{transform:scale(.96)}
.mic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mic.on{background:var(--rec);border-color:var(--rec);color:#fff}
.mic.on svg{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.notes textarea{width:100%;height:88px;resize:none;border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:12px 14px;font:16px/1.45 var(--sans);color:var(--ink);outline:none}
.notes textarea:focus{border-color:var(--navy)}
.notes textarea::placeholder{color:#A39C8E}
.dictar{width:100%;min-height:48px;border:1px solid var(--navy);background:var(--paper);color:var(--navy);border-radius:14px;font:600 16px var(--sans);cursor:pointer}
.dictar:hover,.dictar:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.dictar:active{transform:scale(.98)}
.hint{font-size:13px;color:var(--muted);line-height:1.4;text-wrap:pretty;min-height:0;margin:0}
.hint.err{color:#8B3A32}
.safari{font-size:12px;color:var(--muted);line-height:1.4;text-wrap:pretty;margin:0}
.safari a{color:var(--navy);text-underline-offset:2px}
.ver{margin:2px 0 0;text-align:center;font-size:11px;letter-spacing:.12em;color:var(--muted)}
#dump{display:none;margin:8px 16px 0;width:calc(100% - 32px);height:88px;border:1px solid var(--line);border-radius:12px;background:var(--paper);font:12px/1.4 ui-monospace,Menlo,monospace;padding:10px;color:var(--ink)}
#dump.show{display:block}
.toast{position:fixed;left:50%;bottom:calc(var(--sab) + 20px);transform:translateX(-50%) translateY(16px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s ease,transform .2s ease;pointer-events:none;z-index:9}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (min-width:700px) and (max-width:899px){body{max-width:460px;margin:0 auto}}
@media (min-width:900px){
  body{
    max-width:1400px;width:100%;margin:0 auto;
    padding:calc(var(--sat) + 16px) 28px calc(var(--sab) + 16px);
    display:grid;
    grid-template-columns:minmax(0,1fr) 400px;
    grid-template-rows:auto auto auto auto auto minmax(0,1fr) auto;
    column-gap:28px;align-content:stretch;
  }
  header,.tally,.item-meta,.nav,.notes,#dump{grid-column:2}
  header{padding:4px 0 6px}
  .tally{padding:0 0 8px}
  .item-meta{padding:8px 0 0}
  .nav{padding:12px 0 4px}
  .notes{padding:8px 0 0;min-height:0}
  #dump{margin:8px 0 0;width:100%}
  .stage{
    grid-column:1;grid-row:1 / -1;
    margin:0;min-height:0;height:auto;border-radius:22px;
  }
  .notes textarea{height:160px;min-height:140px}
  .toast{grid-column:1 / -1;grid-row:1}
}
@media (prefers-reduced-motion:reduce){
  .mic.on svg,.toast,.nav button,.export,.dictar,.photo-wrap img.z-anim,.zoom-close{animation:none;transition:none}
}
</style>
</head>

<script>
(function(){
  const KEY = "closetReview.v1";
  const VER = "5";
  const Z_TAP = 2.5;
  const Z_MAX = 4;
  const $ = (id) => document.getElementById(id);
  const photo = $("photo"), photoWrap = $("photoWrap"), notes = $("notes");
  const count = $("count"), prev = $("prev"), next = $("next");
  const micBtn = $("mic"), dictar = $("dictar"), hint = $("micHint");
  const dump = $("dump"), toastEl = $("toast"), stage = $("stage");
  const statusEl = $("micStatus"), zoomClose = $("zoomClose");

  function asset(path){
    if (!path) return "";
    return path + (path.indexOf("?") >= 0 ? "&" : "?") + "v=" + VER;
  }

  let items = [];
  let i = 0;
  let store = {};
  let rec = null;
  let listening = false;
  let wantListen = false;
  let toastTimer = 0;
  let lastInterim = "";
  let scale = 1, tx = 0, ty = 0;

  try { store = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; }
  catch { store = {}; }

  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("on"), 1800);
  }
  function save(){
    if (!items[i]) return;
    store[items[i].id] = { notes: notes.value };
    try { localStorage.setItem(KEY, JSON.stringify(store)); }
    catch {}
  }
  const itemBrand = $("itemBrand"), faltaEl = $("faltaMarca"), itemNiche = $("itemNiche");
  const tallyEl = $("tally");

  function isFalta(it){
    if (!it) return true;
    if (it.falta_marca === true) return true;
    const b = (it.brand || "").toString().trim();
    if (it.falta_marca === false && b) return false;
    return !b;
  }
  function fmtTally(map, special){
    return Object.keys(map).sort((a,b) => {
      if (a === special) return 1;
      if (b === special) return -1;
      if (map[b] !== map[a]) return map[b] - map[a];
      return a.localeCompare(b, "es");
    }).map((k) => k + " " + map[k]).join(" · ");
  }
  function renderTally(){
    const niches = {}, brands = {};
    for (const it of items){
      const n = (it.niche || it.category || "sin categoría").toString().trim() || "sin categoría";
      niches[n] = (niches[n] || 0) + 1;
      const b = isFalta(it) ? "falta marca" : (it.brand || "").toString().trim();
      brands[b] = (brands[b] || 0) + 1;
    }
    tallyEl.replaceChildren();
    if (!items.length){ tallyEl.hidden = true; return; }
    const cat = document.createElement("p");
    const catB = document.createElement("b");
    catB.textContent = "Categorías: ";
    cat.append(catB, document.createTextNode(fmtTally(niches)));
    const br = document.createElement("p");
    const brB = document.createElement("b");
    brB.textContent = "Marcas: ";
    br.append(brB, document.createTextNode(fmtTally(brands, "falta marca")));
    tallyEl.append(cat, br);
    tallyEl.hidden = false;
  }
  function isZoomed(){ return scale > 1.02; }
  function applyZoom(animate){
    photo.classList.toggle("z-anim", !!animate);
    photo.style.transform = "translate(" + tx + "px, " + ty + "px) scale(" + scale + ")";
    photo.dataset.scale = String(scale);
    photo.dataset.tx = String(tx);
    photo.dataset.ty = String(ty);
    const on = isZoomed();
    stage.classList.toggle("zoomed", on);
    zoomClose.hidden = !on;
  }
  function clampPan(){
    if (!isZoomed()){ scale = 1; tx = 0; ty = 0; return; }
    const sw = stage.clientWidth, sh = stage.clientHeight;
    const iw = photo.offsetWidth * scale, ih = photo.offsetHeight * scale;
    const maxX = Math.max(0, (iw - sw) / 2);
    const maxY = Math.max(0, (ih - sh) / 2);
    tx = Math.min(maxX, Math.max(-maxX, tx));
    ty = Math.min(maxY, Math.max(-maxY, ty));
  }
  function zoomTo(newScale, pivotX, pivotY, animate){
    newScale = Math.min(Z_MAX, Math.max(1, newScale));
    const rect = photo.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const vx = pivotX - cx, vy = pivotY - cy;
    const ratio = newScale / (scale || 1);
    tx += vx - vx * ratio;
    ty += vy - vy * ratio;
    scale = newScale;
    clampPan();
    applyZoom(animate);
  }
  function resetZoom(animate){
    scale = 1; tx = 0; ty = 0;
    stage.classList.remove("panning");
    applyZoom(animate);
  }
  function useFullRes(){
    const it = items[i];
    if (!it || !it.srcFull || photo.dataset.full === "1") return;
    photo.src = asset(it.srcFull);
    photo.dataset.full = "1";
  }
  function render(){
    const n = items.length;
    const it = items[i];
    count.textContent = n ? (i + 1) + "/" + n : "0/0";
    prev.disabled = i <= 0;
    next.disabled = i >= n - 1;
    resetZoom(false);
    if (!it){
      photo.removeAttribute("src");
      photo.removeAttribute("data-full");
      photo.alt = "";
      notes.value = "";
      itemBrand.hidden = true;
      itemBrand.textContent = "";
      faltaEl.hidden = true;
      itemNiche.hidden = true;
      itemNiche.textContent = "";
      return;
    }
    photo.dataset.full = "";
    photo.src = asset(it.src);
    photo.alt = it.name || it.id || "prenda";
    notes.value = (store[it.id] && store[it.id].notes) || it.notes || "";
    const falta = isFalta(it);
    if (falta){
      itemBrand.hidden = true;
      itemBrand.textContent = "";
      faltaEl.hidden = false;
    } else {
      itemBrand.hidden = false;
      itemBrand.textContent = (it.brand || "").toString().trim();
      faltaEl.hidden = true;
    }
    const niche = (it.niche || "").toString().trim();
    if (niche){
      itemNiche.hidden = false;
      itemNiche.textContent = niche;
    } else {
      itemNiche.hidden = true;
      itemNiche.textContent = "";
    }
  }
  function go(delta){
    if (listening || wantListen){
      wantListen = false;
      if (rec) try { rec.stop(); } catch {}
      setListeningUI(false);
    }
    save();
    const nextI = i + delta;
    if (nextI < 0 || nextI >= items.length) return;
    i = nextI;
    render();
  }

  notes.addEventListener("input", save);
  prev.addEventListener("click", () => go(-1));
  next.addEventListener("click", () => go(1));

  const pointers = new Map();
  let mode = null;
  let gesture = null;

  function pointerList(){ return Array.from(pointers.values()); }
  function dist(a, b){ return Math.hypot(a.x - b.x, a.y - b.y) || 1; }
  function mid(a, b){ return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }

  function onPointerDown(e){
    if (e.button && e.button !== 0) return;
    if (e.target === zoomClose || (zoomClose.contains && zoomClose.contains(e.target))) return;
    try { stage.setPointerCapture(e.pointerId); } catch {}
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size >= 2){
      const [a, b] = pointerList();
      mode = "pinch";
      gesture = { dist: dist(a, b), scale: scale, tx: tx, ty: ty };
      return;
    }
    mode = isZoomed() ? "maybe-pan" : "maybe-swipe";
    gesture = { x: e.clientX, y: e.clientY, tx: tx, ty: ty, moved: false };
  }
  function onPointerMove(e){
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (mode === "pinch" && pointers.size >= 2){
      const [a, b] = pointerList();
      const m = mid(a, b);
      const startScale = gesture.scale, startTx = gesture.tx, startTy = gesture.ty;
      scale = startScale; tx = startTx; ty = startTy;
      zoomTo(startScale * (dist(a, b) / gesture.dist), m.x, m.y, false);
      return;
    }
    if (!gesture || pointers.size !== 1) return;
    const dx = e.clientX - gesture.x, dy = e.clientY - gesture.y;
    if (Math.hypot(dx, dy) > 8) gesture.moved = true;
    if (isZoomed()){
      mode = "pan";
      stage.classList.add("panning");
      tx = gesture.tx + dx;
      ty = gesture.ty + dy;
      clampPan();
      applyZoom(false);
    }
  }
  function onPointerUp(e){
    pointers.delete(e.pointerId);
    if (mode === "pinch"){
      if (pointers.size < 2){
        if (scale < 1.1) resetZoom(true);
        mode = null;
        gesture = null;
      }
      return;
    }
    if (!gesture){ mode = null; return; }
    const dx = e.clientX - gesture.x, dy = e.clientY - gesture.y;
    const moved = gesture.moved;
    const zoomedNow = isZoomed();
    stage.classList.remove("panning");
    if (mode === "pan" || (zoomedNow && moved)){
      mode = null;
      gesture = null;
      return;
    }
    if (!zoomedNow && moved && Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.2){
      go(dx < 0 ? 1 : -1);
      mode = null;
      gesture = null;
      return;
    }
    if (!moved){
      if (zoomedNow){
        resetZoom(true);
      } else {
        useFullRes();
        zoomTo(Z_TAP, e.clientX, e.clientY, true);
      }
    }
    mode = null;
    gesture = null;
  }

  stage.addEventListener("pointerdown", onPointerDown);
  stage.addEventListener("pointermove", onPointerMove);
  stage.addEventListener("pointerup", onPointerUp);
  stage.addEventListener("pointercancel", onPointerUp);
  stage.addEventListener("contextmenu", (e) => { if (isZoomed()) e.preventDefault(); });
  zoomClose.addEventListener("pointerdown", (e) => { e.stopPropagation(); });
  zoomClose.addEventListener("click", (e) => {
    e.preventDefault();
    e.stopPropagation();
    resetZoom(true);
  });

  document.addEventListener("keydown", (e) => {
    if (isZoomed() && e.key === "Escape"){
      resetZoom(true);
      return;
    }
    if (e.target === notes || e.target === dump) return;
    if (e.key === "ArrowLeft") go(-1);
    if (e.key === "ArrowRight") go(1);
  });

  $("export").addEventListener("click", async () => {
    save();
    const data = items.map((it) => ({
      id: it.id,
      notes: (store[it.id] && store[it.id].notes) || it.notes || ""
    }));
    const text = JSON.stringify(data, null, 2);
    dump.value = text;
    dump.classList.add("show");
    try {
      await navigator.clipboard.writeText(text);
      toast("Copiado");
    } catch {
      dump.focus();
      dump.select();
      toast("Copia el texto de abajo");
    }
  });

  function focusNotes(){
    hint.hidden = false;
    hint.textContent = "Toca el 🎙️ del teclado";
    notes.focus();
    try {
      const n = notes.value.length;
      notes.setSelectionRange(n, n);
    } catch {}
  }
  dictar.addEventListener("click", focusNotes);

  function setStatus(msg, isErr){
    if (!msg){
      statusEl.hidden = true;
      statusEl.textContent = "";
      statusEl.classList.remove("err");
      return;
    }
    statusEl.hidden = false;
    statusEl.textContent = msg;
    statusEl.classList.toggle("err", !!isErr);
  }
  function setListeningUI(on){
    listening = on;
    micBtn.classList.toggle("on", on);
    micBtn.setAttribute("aria-pressed", on ? "true" : "false");
  }
  function isInAppWebView(){
    const ua = navigator.userAgent || "";
    if (/FBAN|FBAV|FB_IAB|Instagram|Line\/|WhatsApp|Snapchat|TikTok|musical_ly|BytedanceWebview|LinkedInApp|Pinterest|Twitter|X\/|Grok\//i.test(ua)) return true;
    if (/; wv\)/.test(ua)) return true;
    const ios = /iPhone|iPad|iPod/i.test(ua);
    const safari = /Safari/i.test(ua);
    const otherBrowser = /CriOS|FxiOS|EdgiOS|OPiOS|DuckDuckGo|Brave/i.test(ua);
    if (ios && !safari && !otherBrowser) return true;
    return false;
  }

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const canSR = !!(SR && !isInAppWebView());
  if (canSR){
    rec = new SR();
    rec.lang = "es-MX";
    rec.continuous = false;
    rec.interimResults = true;
    rec.maxAlternatives = 1;
    rec.onresult = (ev) => {
      let finalChunk = "";
      let interim = "";
      for (let k = ev.resultIndex; k < ev.results.length; k++){
        const text = ev.results[k][0].transcript;
        if (ev.results[k].isFinal) finalChunk += text;
        else interim += text;
      }
      finalChunk = finalChunk.trim();
      if (finalChunk){
        notes.value = notes.value ? notes.value.replace(/\s*$/, "") + " " + finalChunk : finalChunk;
        save();
        lastInterim = "";
        if (wantListen) setStatus("Escuchando…");
      } else if (interim){
        lastInterim = interim;
        setStatus(interim);
      }
    };
    rec.onend = () => {
      if (!wantListen){
        setListeningUI(false);
        if (!statusEl.classList.contains("err")) setStatus("");
        return;
      }
      try {
        rec.start();
        setListeningUI(true);
        if (!lastInterim) setStatus("Escuchando…");
      } catch (err) {
        wantListen = false;
        setListeningUI(false);
        setStatus("");
        focusNotes();
      }
    };
    rec.onerror = (ev) => {
      const err = (ev && ev.error) || "";
      if (err === "no-speech"){
        if (wantListen) setStatus("No te oí, sigue hablando…");
        return;
      }
      if (err === "aborted") return;
      wantListen = false;
      setListeningUI(false);
      setStatus("");
      focusNotes();
    };
    micBtn.hidden = false;
    micBtn.addEventListener("click", () => {
      if (wantListen || listening){
        wantListen = false;
        setListeningUI(false);
        setStatus("");
        try { rec.stop(); } catch {}
        return;
      }
      wantListen = true;
      lastInterim = "";
      setListeningUI(true);
      setStatus("Escuchando…");
      try {
        rec.start();
      } catch (err) {
        if (err && /InvalidState/i.test(String(err.name || err))) return;
        wantListen = false;
        setListeningUI(false);
        setStatus("");
        focusNotes();
      }
    });
  }

  function boot(list){
    items = Array.isArray(list) ? list.filter((it) => it && it.id && it.src) : [];
    i = 0;
    renderTally();
    render();
  }

  fetch(asset("items.json"), {cache:"no-store"})
    .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(boot)
    .catch(() => {
      try {
        const raw = $("items-fallback") && $("items-fallback").textContent;
        boot(JSON.parse(raw || "[]"));
      } catch { boot([]); }
    });

  window.addEventListener("pagehide", save);
})();
</script>
</body>
</html>
