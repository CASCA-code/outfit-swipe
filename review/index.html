<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Revisión de outfits · Clóset de Nicolás</title>
<meta name="theme-color" content="#F5F3EF">
<style>
:root{--bg:#F5F3EF;--paper:#FFFCF7;--ink:#1C1915;--navy:#24304D;--muted:#7A7468;--line:#E3DCD0;--rec:#8B3A32;--ok:#3E5B3A;--warn:#9A6B1F;
--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
--sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-tap-highlight-color:transparent}
button,textarea,select{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:rgba(245,243,239,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:1180px;margin:0 auto}
.brand{font:600 22px/1.1 var(--serif);flex:1;min-width:180px}
.brand small{display:block;font:500 11px/1.4 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.btn{height:40px;padding:0 14px;border:1px solid var(--line);background:var(--paper);border-radius:12px;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover,.btn:focus-visible{border-color:var(--navy);outline:none}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;max-width:1180px;margin:10px auto 0;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-size:13px;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.stat{font-size:12.5px;color:var(--muted)}
main{max-width:1180px;margin:0 auto;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 40px);display:flex;flex-direction:column;gap:18px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:18px;scroll-margin-top:130px}
.card.v-si{box-shadow:inset 4px 0 0 var(--ok)}.card.v-no{box-shadow:inset 4px 0 0 var(--rec)}
@media(max-width:820px){.card{grid-template-columns:1fr;padding:12px;gap:12px}}
.inspo{position:relative}
.inspo img{width:100%;max-height:520px;object-fit:cover;border-radius:14px;display:block;background:#ECE7DE}
.num{position:absolute;top:10px;left:10px;background:var(--ink);color:#fff;font:700 26px/1 var(--serif);padding:8px 12px;border-radius:12px}
.lane{font:600 10.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:10px 2px 4px;display:flex;justify-content:space-between;gap:8px}
.lane a{color:var(--muted)}
.read{font-size:13.5px;color:var(--ink);margin:0 2px;line-height:1.4}
.right{display:flex;flex-direction:column;gap:12px;min-width:0}
.h{font:600 18px/1.2 var(--serif);margin:0}
.slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media(max-width:820px){.slots{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:420px){.slots{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:820px){.slot.empty{display:none}}
@media(max-width:600px){.brand{flex-basis:100%}.top .btn{margin-left:auto}}
.slot{border:1px solid var(--line);border-radius:14px;padding:8px;background:#fff;display:flex;flex-direction:column;gap:4px;min-width:0}
.slot .lbl{font:600 10px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.slot .pic{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center}
.slot .pic img{max-width:100%;max-height:100%;object-fit:contain;mix-blend-mode:multiply}
.slot .nm{font-size:12px;line-height:1.3}
.slot .id{font-size:10.5px;color:var(--muted)}
.slot.empty{background:transparent;border-style:dashed;color:var(--muted);justify-content:center;align-items:center;font-size:12px;min-height:80px}
.fm{display:inline-block;font-size:10px;font-weight:700;color:var(--warn);background:#F6ECD9;border-radius:6px;padding:2px 5px;margin-top:2px}
.gap{font-size:13px;line-height:1.4;background:#F6F1E8;border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:#4A443B}
.gap b{color:var(--warn)}
.rate{display:flex;gap:8px;align-items:center}
.vote{height:40px;min-width:56px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-size:18px;cursor:pointer}
.vote.on.si{background:var(--ok);border-color:var(--ok)}.vote.on.no{background:var(--rec);border-color:var(--rec)}
.saved{font-size:12px;color:var(--muted);margin-left:auto}
textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff;resize:vertical;font-size:15px}
textarea:focus{outline:none;border-color:var(--navy)}
.jump{width:76px;height:40px;border:1px solid var(--line);border-radius:12px;padding:0 10px;background:var(--paper)}
</style></head><body>
<header><div class="top">
 <div class="brand">Tus sí, con tu clóset<small id="sub">Cargando…</small></div>
 <input class="jump" id="jump" type="number" min="1" placeholder="#" aria-label="Ir al número">
 <button class="btn primary" id="exp">Exportar comentarios</button>
</div><div class="chips" id="chips"></div></header>
<main id="list"></main>
<script>
const KEY='outfit-review-v1';
const SL={chaqueta:'Chaqueta',arriba:'Arriba',capa_abajo:'Capa abajo',pantalon:'Pantalón',zapatos:'Zapatos'};
let D,st=JSON.parse(localStorage.getItem(KEY)||'{}'),lane='Todos';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function save(){localStorage.setItem(KEY,JSON.stringify(st));stats()}
function stats(){const v=Object.values(st);document.getElementById('sub').textContent=`${D.count} looks · ${v.filter(x=>x.vote==='si').length} 👍 · ${v.filter(x=>x.vote==='no').length} 👎 · ${v.filter(x=>x.comment).length} comentarios`}
function card(it){
 const s=st[it.num]||{};
 const slots=D.slots.map(k=>{const p=it.slots[k];
  if(!p)return `<div class="slot empty"><span class="lbl">${SL[k]}</span>—</div>`;
  return `<div class="slot"><span class="lbl">${SL[k]}</span><div class="pic"><img loading="lazy" src="${esc(p.img)}" alt="${esc(p.name)}"></div><div class="nm">${esc(p.name)}</div><div class="id">${esc(p.id)}</div>${p.falta_marca?'<span class="fm">falta_marca</span>':''}</div>`}).join('');
 return `<article class="card ${s.vote?'v-'+s.vote:''}" id="n${it.num}" data-n="${it.num}">
 <div><div class="inspo"><img loading="lazy" referrerpolicy="no-referrer" src="${esc(it.remote)}" alt="Inspo ${it.num}"><span class="num">#${it.num}</span></div>
 <div class="lane"><span>${esc(it.lane)} · ${esc(it.batch)}</span><a href="${esc(it.source_url)}" target="_blank" rel="noopener">fuente</a></div>
 <p class="read">${esc(it.inspo_read)}</p></div>
 <div class="right"><h2 class="h">#${it.num} con tu ropa</h2><div class="slots">${slots}</div>
 ${it.gap?`<div class="gap"><b>Nota:</b> ${esc(it.gap)}</div>`:''}
 <div class="rate"><button class="vote si ${s.vote==='si'?'on':''}" data-v="si" aria-label="Me gusta">👍</button><button class="vote no ${s.vote==='no'?'on':''}" data-v="no" aria-label="No me gusta">👎</button><span class="saved"></span></div>
 <textarea placeholder="Comentario para #${it.num}…">${esc(s.comment||'')}</textarea></div></article>`}
function render(){const L=document.getElementById('list');L.innerHTML=D.items.filter(i=>lane==='Todos'||i.lane===lane).map(card).join('')}
function chips(){const c={};D.items.forEach(i=>c[i.lane]=(c[i.lane]||0)+1);
 const el=document.getElementById('chips');el.innerHTML=['Todos',...Object.keys(c)].map(l=>`<button class="chip ${l===lane?'on':''}" data-l="${esc(l)}">${esc(l)} ${l==='Todos'?D.count:c[l]}</button>`).join('');
 el.onclick=e=>{const b=e.target.closest('.chip');if(!b)return;lane=b.dataset.l;chips();render()}}
document.getElementById('list').addEventListener('click',e=>{const b=e.target.closest('.vote');if(!b)return;const card=b.closest('.card'),n=card.dataset.n;st[n]=st[n]||{};
 st[n].vote=st[n].vote===b.dataset.v?null:b.dataset.v;card.querySelectorAll('.vote').forEach(x=>x.classList.toggle('on',x.dataset.v===st[n].vote));card.className='card '+(st[n].vote?'v-'+st[n].vote:'');save()});
let t;document.getElementById('list').addEventListener('input',e=>{if(e.target.tagName!=='TEXTAREA')return;const card=e.target.closest('.card'),n=card.dataset.n;st[n]=st[n]||{};st[n].comment=e.target.value;clearTimeout(t);t=setTimeout(()=>{save();card.querySelector('.saved').textContent='guardado'},300)});
document.getElementById('jump').addEventListener('change',e=>{lane='Todos';chips();render();const el=document.getElementById('n'+e.target.value);if(el)el.scrollIntoView({behavior:'smooth'})});
document.getElementById('exp').onclick=()=>{const out=D.items.filter(i=>st[i.num]&&(st[i.num].vote||st[i.num].comment)).map(i=>({num:i.num,inspo_id:i.inspo_id,pieces:Object.fromEntries(D.slots.map(k=>[k,i.slots[k]?i.slots[k].id:null])),vote:st[i.num].vote||null,comment:st[i.num].comment||''}));
 const b=new Blob([JSON.stringify({exported:new Date().toISOString(),count:out.length,items:out},null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='comentarios-outfits.json';a.click()};
fetch('review.json?v=1').then(r=>r.json()).then(d=>{D=d;chips();render();stats()});
</script></body></html>
